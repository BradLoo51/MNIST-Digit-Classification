<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>MNIST Digits Classification</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: #f5f5f5;
            }
            #canvas {
                border: 2px solid #333;
                background: black;
                touch-action: none;
            }
            .controls {
                margin-top: 15px;
                display: flex;
                gap: 20px;
            }
            button {
                padding: 10px 20px;
                font-size: 1rem;
                cursor: pointer;
                border: none;
                border-radius: 5px;
            }
            #predictBtn {
                background-color: #4CAF50;
                color: white;
            }
            #clearBtn {
                background-color: #f44336;
                color: white;
            }
            #result {
                margin-top: 30px;
                font-size: 1.5rem;
            }
        </style>
    </head>
    <body>
        <h1 style="margin-bottom: 0rem;">MNIST Digits Classification</h1>
        <p style="margin-bottom: 2rem; font-size: 1.2rem;">Draw a digit (0-9) in the box below.</p>
        <canvas id="canvas" width="280" height="280"></canvas>
        <div class="controls">
            <button id="clearBtn">Clear</button>
            <button id="predictBtn">Predict</button>
        </div>
        <div id="result">Prediction: </div>
        <div id="prediction"></div>

        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
